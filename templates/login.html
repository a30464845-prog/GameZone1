<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - GameZone</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .login-container {
      max-width: 400px; margin: 100px auto; padding: 40px;
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 16px; backdrop-filter: blur(10px);
    }
    .login-container h2 { text-align: center; margin-bottom: 25px; color: #00d4ff; }
    .login-container .form-group { margin-bottom: 20px; }
    .login-container input {
      width: 100%; padding: 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
      background: rgba(0,0,0,0.4); color: #fff; font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2>Admin Login</h2>
    
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="flash {{ category }}" style="position: static; margin-bottom: 15px; animation: none;">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <input type="text" name="username" placeholder="Username (admin)" required>
      </div>
      <div class="form-group">
        <input type="password" name="password" placeholder="Password (admin123)" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
    <br>
    <a href="{{ url_for('home') }}" style="color: #94a3b8; text-align: center; display: block; text-decoration: none;">&larr; Wapas Homepage par jayein</a>
  </div>
</body>
</html>
